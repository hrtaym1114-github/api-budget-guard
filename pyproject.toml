[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-budget-guard"
version = "0.1.1"
description = "Offline CLI guardrail for metered API budgets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "hrtaym1114" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
api-budget-guard = "api_budget_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_budget_guard = ["presets/*.json"]
